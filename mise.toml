[tools]
zola = "0.22.1"
python = "3.13"

[tasks.llms]
description = "Generate llms.txt, llms-full.txt and Markdown twins (committed; Pages only runs zola build)"
run = "python scripts/build_llms.py"

[tasks.dev]
run = "zola serve"

[tasks.build]
depends = ["llms"]
run = "zola build"

[tasks.check]
description = "zola check, drift against avenir templates, security.txt expiry"
run = ["zola check --skip-external-links", "python scripts/check_site.py"]

[tasks.visuals]
description = "Encode visuals/incoming/*.png listed in visuals/slots.toml and write visuals/catalog.json (needs ImageMagick)"
run = "python scripts/build_visuals.py"
