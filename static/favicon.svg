  <path d="M17 14 Q18 13 18 15 Q18 18 17 20 Q16 18 17 14 Z" fill="none" stroke="url(#g)" stroke-width="0.8" opacity="0.7"/>
  <!-- Asia -->
  <path d="M19 8 Q22 9 24 10 Q23 12 21 13 Q19 12 19 10 Z" fill="none" stroke="url(#g)" stroke-width="0.8" opacity="0.7"/>
  <!-- Australia -->
