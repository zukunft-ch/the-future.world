  <!-- Longitude lines -->
  <ellipse cx="16" cy="16" rx="4" ry="12" fill="none" stroke="url(#g)" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="16" cy="16" rx="8.5" ry="12" fill="none" stroke="url(#g)" stroke-width="0.5" opacity="0.35"/>
  <ellipse cx="16" cy="16" rx="12" ry="12" fill="none" stroke="url(#g)" stroke-width="0.5" opacity="0.3" transform="rotate(30 16 16)"/>
  <ellipse cx="16" cy="16" rx="12" ry="12" fill="none" stroke="url(#g)" stroke-width="0.5" opacity="0.3" transform="rotate(-30 16 16)"/>
