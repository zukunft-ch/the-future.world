# Visual slots for the-future.world: one record per picture the site can show.
#
# A slot appears on the site only once its original exists at visuals/incoming/<slot>.png.
# `mise run visuals` encodes it (AVIF/WebP/JPEG at 600/960/1536 px), writes visuals/catalog.json
# (read by the shared avenir macros/visual.html) and records provenance in visuals/provenance.json.
#
# To generate a picture: paste `style` + the slot's `scene` as one prompt (landscape 3:2, 1536×1024),
# save the result as visuals/incoming/<slot>.png and the exact prompt used as <slot>.txt.
# Check the `alt` text against the actual picture before committing.
#
# Rules (same as the Swiss kit in assets/visuals/PROMPTS.md): always labelled as AI-generated,
# no real people, no identifiable real places, no text/logos/flags, one look.

caption = "Visualisation · AI-generated"
note = "Imagined scene, not an existing project."

style = """Documentary photograph, medium format, natural colours, subtle film grain, clear air and light haze. \
Soft early-morning light: pale rose and violet in the sky, warm sun on the land. Nature, water and open sky take \
about two thirds of the frame. Human-made structures are small, calm and well made: pale ceramic, light timber, \
glass, low and integrated into the terrain. Technology is mature and quiet: matte white, rounded, functional, never \
the subject. Few people, small in the frame, natural and unposed, seen from a distance, from behind or in profile, \
no identifiable faces. The place is imagined and could be on any continent: no identifiable city, landmark or \
country. One small accent of warm rose or violet. Wide composition, high horizon, a sense of order and calm. \
No text, logos, flags, signs, screens, holograms, neon, chrome, flying vehicles, monumental skyscrapers, crowds, \
dystopia or glossy CGI."""

